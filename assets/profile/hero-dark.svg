<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-labelledby="t">
  <title id="t">G. Karthik Koundinya. I build AI that holds up in production: agents, retrieval systems, risk models, evals.</title>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .name { fill: #f2f2f0; font-size: 44px; font-weight: 700; letter-spacing: -0.5px; }
    .line { fill: #a3a29b; font-size: 22px; }
    .w { fill: #3987e5; font-size: 22px; font-weight: 600; opacity: 0; animation: rot 10s infinite; }
    @keyframes rot { 0%, 22% { opacity: 1; } 25%, 100% { opacity: 0; } }
    .v { fill: #3987e5; opacity: .2; animation: vote 3s ease-in-out infinite; }
    @keyframes vote { 30%, 55% { opacity: 1; } }
    .link { stroke: #3a3a37; stroke-width: 2; fill: none; stroke-dasharray: 4 6; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .out { fill: none; stroke: #3987e5; stroke-width: 2.5; }
    .cap { fill: #a3a29b; font-size: 13px; }
    @media (prefers-reduced-motion: reduce) {
      .w, .v, .link { animation: none; }
      .w0 { opacity: 1; }
      .v { opacity: 1; }
    }
  </style>
  <text class="mono cap" x="4" y="30">~/g26karthik</text>
  <text class="name" x="2" y="86">G. Karthik Koundinya</text>
  <text class="line" x="4" y="128">I build AI that holds up in production:</text>
    <text class="w w0" style="animation-delay:0.0s" x="374" y="128">agents</text>
    <text class="w" style="animation-delay:2.5s" x="374" y="128">retrieval systems</text>
    <text class="w" style="animation-delay:5.0s" x="374" y="128">risk models</text>
    <text class="w" style="animation-delay:7.5s" x="374" y="128">evals</text>
  <g>
    <circle class="v" style="animation-delay:0.00s" cx="960" cy="86" r="6"/>
    <circle class="v" style="animation-delay:0.18s" cx="986" cy="86" r="6"/>
    <circle class="v" style="animation-delay:0.36s" cx="1012" cy="86" r="6"/>
    <circle class="v" style="animation-delay:0.54s" cx="1038" cy="86" r="6"/>
    <circle class="v" style="animation-delay:0.72s" cx="1064" cy="86" r="6"/>
    <path class="link" d="M1070,86 L1128,86"/>
    <circle class="out" cx="1142" cy="86" r="12"/>
    <circle cx="1142" cy="86" r="5" fill="#3987e5"/>
    <text class="mono cap" x="960" y="128">5 votes → 1 decision</text>
  </g>
</svg>
